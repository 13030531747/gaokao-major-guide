 if(clinical)return ['早期/规培阶段：税前约 4,000—10,000 元/月；成熟后差异很大','早期税前约 6,000—14,000 元/月；绩效、科室和医院差异大','基层或辅助岗位税前约 4,000—8,000 元/月','通常约 5,000—12,000 元/月；地区、职称和绩效差异大'][i];
 if(medical)return ['税前约 7,000—18,000 元/月；研发和高学历岗位可能更高','税前约 6,000—14,000 元/月','税前约 4,000—10,000 元/月','税前约 5,000—12,000 元/月；公立单位按地区和职级变化'][i];
 return ['税前约 12,000—30,000 元/月；少数岗位更高但竞争很强','税前约 8,000—18,000 元/月','税前约 4,500—10,000 元/月','税前约 6,000—14,000 元/月；全年收入受地区、单位和绩效影响'][i];
}
function detail(t,tab='overview'){
 let html='';
 if(tab==='overview')html=block('这个专业具体学什么',`<p>${esc(t.b)} 本科通常会接触：${esc(t.study)}</p>`)+block('本科与研究生速看',`<div class="income">${info('本科：常见岗位',esc(t.u.job)+`<strong>${esc(t.u.pay)}</strong>`+esc(t.u.need))}${info('研究生：常见岗位',esc(t.r.job)+`<strong>${esc(t.r.pay)}</strong>`+esc(t.r.need))}${info('主要判断',esc(t.fit))}</div>`)+block('具体企业与岗位类型',`<p><b>企业样本：</b>${esc(t.company)}</p><p><b>对应岗位：</b>${esc(t.u.job)}；研究生阶段还可能进入：${esc(t.r.job)}</p>`)+block('公务员与事业单位速看',`<p>${esc(t.gov)}</p>`)+block('最大差异与风险',`<p>${esc(common.cautions)}</p><p>${esc(t.uwork)} ${esc(t.rwork)}</p>`);
 if(tab==='undergraduate')html=block('本科阶段：学习与就业',`<p>${esc(t.study)}</p><p><b>常见岗位：</b>${esc(t.u.job)}</p><p><b>工作内容：</b>${esc(t.uwork)}</p>`)+block('本科收入参考',`<div class="income">${info('普通城市应届',esc(t.u.pay))}${info('更好岗位', '可能高于常规范围，取决于城市、企业、项目和实习。')}${info('3—5年后','收入差异会扩大；岗位方向、证书、技术能力或业务能力决定变化。')}</div><p class="note">${esc(common.cautions)}</p>`)+block('本科阶段更该准备什么',`<p>把课程知识变成可展示的项目；关注实习、岗位要求、证书或资格条件。公考和事业单位必须查看当年职位表，不以专业名称自行推断。</p>`);
 if(tab==='graduate')html=block('研究生阶段：方向与岗位',`<p><b>可能方向：</b>${esc(t.r.job)}</p><p><b>主要工作：</b>${esc(t.rwork)}</p><p><b>读研价值：</b>${esc(t.r.need)} 研究生学历主要解决部分岗位的学历门槛，不能替代工程、临床、实验或沟通能力。</p>`)+block('研究生收入参考',`<div class="income">${info('普通城市应届',esc(t.r.pay))}${info('大城市/较强岗位','可能达到范围上沿或更高，但筛选更强，不能当作常规水平。')}${info('3—5年后','受研究方向、工作单位、成果和实际能力影响很大。')}</div><p class="note">${esc(common.cautions)}</p>`)+block('是否值得读研',`<p>${esc(t.fit)} 如果目标岗位本科已经能进入，读研应比较时间成本、学校/导师/方向质量和实际去向，而不是只看学历标签。</p>`);
 if(tab==='career')html=block('对应企业与单位类型',`<p>${esc(t.company)}</p>`)+block('收入层级与硬性学历限制',`<div class="cols">${t.levels.map((x,i)=>info(`${x[0]}（${levelIncome(t,i)}）`,`<b>大致收入：</b><strong>${levelIncome(t,i)}</strong><br><b>代表企业/单位：</b>${esc(t.levelCompanies[i]||t.levelCompanies[0]||'请按岗位关键词核实具体企业')}<br><b>岗位/单位概况：</b>${esc(x[1])}<br><b>本科硬条件：</b>${esc(x[2])}<br><b>研究生硬条件：</b>${esc(x[3])}`)).join('')}</div><p class="note">“硬条件”指招聘公告或校招筛选中可能直接影响能否投递/进入筛选的条件，不代表所有企业统一规则。薪资层级按常见岗位定位理解，不将少数高薪案例当作普遍水平。</p>`)+block('公务员与事业单位方向',`<p>${esc(t.gov)}</p>`)+block('具体岗位名称',`<div class="cols">${[...new Set((t.u.job+'；'+t.r.job).split(/[、；，,]/).map(x=>x.trim()).filter(Boolean))].map(x=>info(x,'本科或研究生阶段可能对应的岗位名称；是否招聘、学历和专业限制以具体公告为准。')).join('')}</div>`)+block('职业路线对照',`<div class="cols">${t.routes.map((x,i)=>info(x,i===0?'通常从专业相关入门岗开始，具体工作由单位和方向决定。':i===1?'国企、事业单位或大型企业会关注学历、专业限制和招聘批次。':'是否适合取决于地区、证书、出差/轮班接受度与个人能力。')).join('')}</div>`)+block('路线判断',`<p>${esc(t.uwork)} ${esc(t.rwork)}</p><p>私企请按“岗位名称+城市+学历+工作年限”比较；公务员、事业单位、医院、国企的资格和收入必须按当地当年公告核实。</p>`);
 if(tab==='ai'){const a=AI_BY_MAJOR[t.n]||AI_GUIDE[t.g]||AI_DEFAULT;const paths=a.hedge;html=block('AI影响与风险判断',`<p><b>当前判断：</b>${esc(a.level)}</p><p class="note">区分任务自动化、岗位减少、招聘缩减和收入变化。岗位仍存在，不代表岗位数量和收入不受影响。</p>`)+block('问题严重在哪里',`<p>AI发展速度可能快于个人学习和企业调整。简单、重复、可验收、主要靠信息处理的任务容易先被压缩，初级岗位和校招入口尤其值得关注。不能保证“复杂工作一定需要人”；未来可能由AI完成更多环节，或由更少的人借助AI完成原来多人的工作。</p><p>${esc(a.hit)}</p>`)+block('相对明确与不确定的部分',`<p><b>可能被AI增强的工作：</b>${esc(a.gain)}</p><p><b>不能打包票：</b>具体岗位还会保留多少人、收入如何变化、变化何时发生，目前无法可靠确定；企业、地区和行业差异很大。这里是岗位内容分析，不是就业数量预测。</p>`)+block('本专业的对冲思路：不保证不被替代，扩大转向和创造价值的空间',`<p>${esc(a.hedge)}</p><div class="cols">${info('专业能力迁移','整理本专业能解决的问题、掌握的工具和相邻岗位，不只绑定一个岗位名称。')}${info('AI协作能力','会提出需求、验证结果、发现错误、改进方案并对交付负责，而非只复制生成内容。')}${info('尝试创造需求与收益','用AI降低实现成本，围绕具体用户或行业问题做可交付的工具、分析、设计、实验方案、工程改造或专业服务；先验证谁有痛点、谁愿意付费，再考虑订阅、定制、项目和服务。每个专业的例子以本专业知识为核心，不是通用创业保证。')}${info('岗位收缩时的备选','提前准备相邻岗位、行业知识、资格/学历、项目作品和可展示成果，降低对单一岗位或企业的依赖；仍不能保证成功。')}</div>`)+block('持续观察招聘变化',`<p>定期比较目标企业近两三年的校招岗位、岗位名称、招聘人数趋势、学历要求与职责变化。若初级岗位减少、学历要求上移或职责扩大，就据此调整准备方向。具体企业是否缩招、岗位是否取消，请主动查看企业官网、校招公告和招聘平台。</p><p class="note">风险真实，不能靠“AI一定替代不了人”来安慰；但岗位重组也不等于个人没有出路。对冲目标是能使用AI、迁移到相邻问题，并尝试创造有价值的解决方案，不是保证就业或收益。</p>`)}

 if(tab==='education')html=block('推荐学历',`<p>普通入门岗位：本科通常可以；高门槛研发、算法、科研、医院核心岗位或复杂工程方向：通常更建议硕士；高校教师和独立科研路线常见要求更高。最终以具体招聘公告为准。</p>`)+block('大学参考（按方向了解，不是录取或就业保证）',`<p>${esc(t.schools)}</p>`)+block('选大学时核对',`<p>招生章程、专业课程、学院与实验室、实习/校企合作、保研与考研去向、近年就业质量报告和当年招生计划。不要只按综合排名或宣传口号判断。</p>`);
 if(tab==='check')html=block('招聘平台',`<div class="linkbox"><span>BOSS直聘：私企岗位</span><span>智联招聘 / 前程无忧：传统行业与校招</span><span>猎聘：经验岗</span><span>国聘：国企校招</span></div><p>搜索格式：专业/岗位 + 城市 + 本科或硕士 + 应届生/3年经验。重点比较学历、技能、工作地点、绩效、年终奖、出差和工作时间。</p>`)+block('官方渠道',`<div class="linkbox"><span>国家公务员局</span><span>各省人事考试网</span><span>单位/医院官网</span><span>阳光高考</span><span>中国研究生招生信息网</span><span>目标大学招生网</span></div><p>公考、事业单位、医院资格和学校招生计划都可能随年份变化；网站只提供查找路径，不替代当年公告。</p>`)+block('不确定项',`<p>${esc(common.cautions)}</p>`);
 $('#dbody').innerHTML=html;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
}
function open(i){let t=data[i];current=t;$('#dkind').textContent=t.k+' · '+t.g;$('#dtitle').textContent=t.n;$('#dintro').textContent=t.b;$('#summary').innerHTML=`<b>一句话判断：</b>${esc(t.u.need)} ${esc(t.r.need)}<br><span class="tagline">路线：${esc(t.routes.join(' · '))}</span>`;$('#detail').classList.add('on');document.body.style.overflow='hidden';detail(t)}
$('#grid').addEventListener('click',e=>{let b=e.target.closest('[data-open]');if(b)open(Number(b.dataset.open))});$('#close').onclick=()=>{$('#detail').classList.remove('on');document.body.style.overflow='';current=null};$('#detail').addEventListener('click',e=>{if(e.target===$('#detail'))$('#close').click()});$('#tabs').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b&&current)detail(current,b.dataset.tab)});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#detail').classList.contains('on'))$('#close').click()});$('#search').addEventListener('input',render);renderFilters();render();
</script>
</body></html>
